apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: manufacturing-app
  labels:
    app.kubernetes.io/name: app-config
    app.kubernetes.io/part-of: manufacturing-scheduler
data:
  # 브라우저에서 API를 호출할 때 사용할 기본 경로
  # Ingress를 같은 호스트에 붙일 예정이므로 상대 경로를 우선 사용한다.
  NEXT_PUBLIC_API_URL: /api

  # backend/app/core/config.py 와 맞춰서 운영할 기본 모델명
  OPENAI_EMBEDDING_MODEL: text-embedding-3-small
  OPENAI_CHAT_MODEL: gpt-4o-mini

  # R2 폴더 접두어는 기존 Docker 버전과 동일하게 유지한다.
  R2_RAG_PREFIX: rag-docs/
  R2_SAFETY_MANAGE_PREFIX: safety_manage/
  R2_SCHEDULE_INPUT_PREFIX: schedule-data-input/
  R2_SCHEDULE_OUTPUT_PREFIX: schedule-data-output/

  # 업로드 및 RAG 동작 기준값
  MAX_UPLOAD_SIZE_MB: "200"
  RAG_CHUNK_SIZE: "1000"
  RAG_CHUNK_OVERLAP: "150"
  RAG_TOP_K: "4"
