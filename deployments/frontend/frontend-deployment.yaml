apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: manufacturing-app
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: manufacturing-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: manufacturing-scheduler
    spec:
      containers:
        - name: frontend
          # latest 대신 불변 태그를 사용해 배포 이력을 추적한다.
          image: docker.io/dong5053/manufacturing-scheduler-frontend:3.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            # 프론트는 API 주소만 필요하지만, configMap 하나로 읽어두면 나중에 확장하기 쉽다.
            - configMapRef:
                name: app-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
