apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: manufacturing-app
  labels:
    app.kubernetes.io/name: backend-migrate
    app.kubernetes.io/part-of: manufacturing-scheduler
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
        app.kubernetes.io/part-of: manufacturing-scheduler
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: docker.io/dong5053/manufacturing-scheduler-backend:3.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
          args:
            - alembic upgrade head
          envFrom:
            - secretRef:
                name: postgres-secret
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          env:
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@postgres.manufacturing-app.svc.cluster.local:5432/$(POSTGRES_DB)
