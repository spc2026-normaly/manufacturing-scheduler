apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: manufacturing-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: manufacturing-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: manufacturing-scheduler
    spec:
      containers:
        - name: grafana
          # dashboard/provisioning 파일을 포함한 커스텀 이미지를 불변 태그로 사용한다.
          image: docker.io/dong5053/manufacturing-scheduler-grafana:3.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secret
                  key: GF_SECURITY_ADMIN_PASSWORD
            # PostgreSQL datasource provisioning에서 사용할 DB 접속값
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-secret
                  key: POSTGRES_USER
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-secret
                  key: POSTGRES_DB
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-exporter-secret
                  key: POSTGRES_PASSWORD
            # Grafana 를 /grafana 경로에서 서비스한다.
            - name: GF_SERVER_ROOT_URL
              value: "%(protocol)s://%(domain)s/grafana/"
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          volumeMounts:
            - name: grafana-storage
              mountPath: /var/lib/grafana
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: grafana-storage
          persistentVolumeClaim:
            claimName: grafana-pvc
