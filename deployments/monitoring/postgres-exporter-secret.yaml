apiVersion: v1
kind: Secret
metadata:
  name: postgres-exporter-secret
  namespace: manufacturing-monitoring
  labels:
    app.kubernetes.io/name: postgres-exporter-secret
    app.kubernetes.io/part-of: manufacturing-scheduler
type: Opaque
stringData:
  # monitoring 네임스페이스에서만 사용하는 exporter 전용 DB 접근 정보
  POSTGRES_DB: manufacturing_db
  POSTGRES_USER: admin
  POSTGRES_PASSWORD: change-me-strong-password
