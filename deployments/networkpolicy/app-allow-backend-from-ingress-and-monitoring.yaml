apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-from-ingress-and-monitoring
  namespace: manufacturing-app
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: backend
  policyTypes:
    - Ingress
  ingress:
    # 외부 사용자의 /api 요청은 ingress-nginx 를 통해 backend 로 들어온다.
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    # Prometheus 는 monitoring 네임스페이스에서 backend /metrics 를 수집한다.
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: manufacturing-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8000
