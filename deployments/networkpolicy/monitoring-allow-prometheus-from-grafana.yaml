apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-from-grafana
  namespace: manufacturing-monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
  ingress:
    # Grafana 가 Prometheus 를 조회할 수 있게 허용한다.
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: manufacturing-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 9090
